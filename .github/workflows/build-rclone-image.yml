# OpenList + rclone 集成镜像：构建 → 冒烟 → 推 GHCR。
#
# 触发：手动；或 push 到 main 且改动涉及驱动/Dockerfile（自动出图）。
# 产物：ghcr.io/yukaidi1220/openlist-rclone:{latest,<run_number>,<短sha>}
#
# 包名是 openlist-rclone，与上游 test_docker.yml 产出的 openlist 包分开：两套 tag
# 互不覆盖，上游那个清理 untagged 版本的 workflow 也不会碰到这里。包关联到
# yukaidi1220/OpenList 仓库（Dockerfile 里带了 org.opencontainers.image.source），
# 所以本仓库的 workflow 自动有写权限，不需要手工配 Manage Actions access。
#
# rclone 版本由 Dockerfile.rclone 的 RCLONE_DOWNLOAD_URL 决定，默认跟 fork 的
# releases/latest（每次构建真下载，CI 没有层缓存）。所以升级 rclone 只要 fork 打新 tag
# 等 release 转正，然后手动重跑本 workflow 即可——不用改 Dockerfile。要复现某个旧镜像
# 就用 Dockerfile 里同名的 build-arg 钉住具体版本。
name: build-rclone-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.rclone'
      - 'docker/rclone/**'
      - 'entrypoint.sh'
      - 'drivers/Rclone/**'
      # 镜像里的 openlist 是 RUN bash build.sh dev docker 现编的，所以源码、构建脚本、
      # 依赖清单里任何变化都换二进制。internal/** 覆盖 op 层（目录缓存、取链、负向缓存），
      # 也就是驱动实际用到的那些；build.sh / go.mod / go.sum 漏了就会出一个内容变了
      # 却没重建的镜像。
      - 'internal/**'
      - 'build.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-rclone-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-rclone-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建镜像
        run: |
          # run_number 是 workflow 自己的计数器，看不出对应哪次提交，重建 workflow
          # 后还会从 1 重来；短 sha 才能反查到源码。两个都留：按 run_number 回滚
          # 好念，按 sha 追根溯源。
          docker build -f Dockerfile.rclone \
            -t ghcr.io/yukaidi1220/openlist-rclone:latest \
            -t ghcr.io/yukaidi1220/openlist-rclone:${{ github.run_number }} \
            -t ghcr.io/yukaidi1220/openlist-rclone:sha-${GITHUB_SHA::7} .

      - name: 冒烟（镜像内二进制与用户）
        run: |
          docker run --rm --entrypoint /bin/sh ghcr.io/yukaidi1220/openlist-rclone:latest -c '
            set -e
            test -x /opt/openlist/openlist && echo "OK openlist"
            test -x /entrypoint.sh && echo "OK entrypoint"
            test -x /opt/rclone/rclone && echo "OK rclone"
            test -x /opt/service/stop/rclone/run && echo "OK runsv"
            /opt/openlist/openlist version | head -n 1
            /opt/rclone/rclone version | head -n 1
            id'

      - name: 冒烟（容器内 rcd 活体）
        run: |
          # 上面只验了二进制存在；这里起容器验证 entrypoint 的 rcd 守护真的能拉起
          # entrypoint 读的是 RCLONE_RC_PORT；写错名字它不会报错，只是回落到默认 5572
          #
          # trap 兜住所有退出路径：下面任何一条断言失败都会在 `docker rm` 之前退出，
          # 把容器留在 runner 上。runner 虽然是临时的，但留着它会让失败日志更难读。
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke -e RUN_RCLONE=true -e RCLONE_RC_PORT=5572 -e RCLONE_RC_USER=smoke -e RCLONE_RC_PASS=smoke ghcr.io/yukaidi1220/openlist-rclone:latest
          for i in $(seq 1 20); do
            sleep 2
            if docker exec smoke sh -c 'wget -qO- http://127.0.0.1:5244/ping' 2>/dev/null | grep -q pong; then
              echo "OK openlist 存活"
              break
            fi
            [ "$i" = "20" ] && { echo "::error::openlist 未在 40 秒内就绪"; docker logs smoke; exit 1; }
          done
          sleep 6
          docker exec smoke sh -c 'ps -ef | grep -c "[r]clone rcd"' | grep -q '^[1-9]' && echo "OK rcd 存活"
          docker exec smoke sh -c 'cat /var/log/rcd.log 2>/dev/null | tail -3'

      - name: 推送 GHCR
        run: |
          docker push ghcr.io/yukaidi1220/openlist-rclone:latest
          docker push ghcr.io/yukaidi1220/openlist-rclone:${{ github.run_number }}
          docker push ghcr.io/yukaidi1220/openlist-rclone:sha-${GITHUB_SHA::7}

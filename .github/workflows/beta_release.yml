name: Beta Release builds

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changelog:
    name: Beta Release Changelog
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.gen-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release tag (Beijing time)
        id: gen-tag
        run: |
          TAG=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Release tag: $TAG"

      - name: Resolve previous tag
        run: |
          set -e
          # 找到上一个匹配时间戳格式的 tag
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^[0-9]{12}$' | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            PREV_SHA=$(git rev-list -n 1 "$PREV_TAG" 2>/dev/null || true)
            echo "PREV_SHA=$PREV_SHA" >> $GITHUB_ENV
            echo "Found previous tag: $PREV_TAG ($PREV_SHA)"
          else
            echo "No previous timestamp tag found"
          fi

      - name: Create tag
        uses: ovsds/create-or-update-ref-action@v1
        with:
          ref: tags/${{ env.RELEASE_TAG }}
          sha: ${{ github.sha }}

      - name: Generate changelog
        id: changelog
        run: |
          set -e
          changes_file=.changes.tmp
          range=""

          if [ -n "${PREV_SHA:-}" ]; then
            range="${PREV_SHA}..$GITHUB_SHA"
            git log --no-merges --pretty="- %s (%h)" "$range" > "$changes_file" || true
          else
            git log --no-merges -n 30 --pretty="- %s (%h)" > "$changes_file" || true
          fi

          {
            echo "# Release $RELEASE_TAG"
            echo
            if [ -n "$range" ]; then
              echo "Range: $range"
            else
              echo "Range: latest 30 commits (no previous tag)"
            fi
            echo
            if [ -s "$changes_file" ]; then
              cat "$changes_file"
            else
              echo "- No user-facing changes in this range"
            fi
          } > CHANGELOG.md

          rm -f "$changes_file"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: CHANGELOG.md
          prerelease: false
          make_latest: true
          tag_name: ${{ env.RELEASE_TAG }}

      - name: Upload assets to github artifact
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: ${{ github.workspace }}/CHANGELOG.md
          compression-level: 0
          if-no-files-found: error

  release:
    needs:
      - changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "linux-amd64"
            hash: "md5-linux-amd64"
            flags: ""
            goflags: ""
          - target: "windows-amd64"
            hash: "md5-windows-amd64"
            flags: ""
            goflags: ""
          - target: "linux-amd64-musl"
            hash: "md5-linux-musl-amd64"
            flags: "-ldflags=-linkmode external -extldflags '-static -fpic'"
            goflags: ""
            musl_static: "true"
          - target: "windows7-*"
            hash: "md5-windows7"
            flags: ""
            goflags: "-tags=sqlite_cgo_compat"
            musl_static: "false"
    name: Beta Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"

      - name: Setup web
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build
        uses: OpenListTeam/cgo-actions@v1.2.5
        with:
          targets: ${{ matrix.target }}
          flags: ${{ matrix.flags || '-ldflags=' }}
          static-link-for-musl: true
          musl-target-format: $os-$musl-$arch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          output: openlist-$target$ext
          musl-base-url: "https://github.com/OpenListTeam/musl-compilers/releases/latest/download/"
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=Xiaraon Studio <noreply@xrgzs.top>
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=${{ needs.changelog.outputs.release_tag }}
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling
        env:
          GOFLAGS: ${{ matrix.goflags }}

      - name: Verify musl binaries are static
        if: matrix.musl_static == 'true'
        run: |
          set -e
          shopt -s nullglob
          files=(build/openlist-*-musl-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No musl binaries found"
            exit 1
          fi
          for f in "${files[@]}"; do
            if readelf -l "$f" | grep -q "Requesting program interpreter"; then
              echo "Dynamic binary detected: $f"
              readelf -l "$f" | grep "Requesting program interpreter" || true
              exit 1
            fi
          done

      - name: Compress
        run: |
          bash build.sh zip ${{ matrix.hash }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/compress/*
          prerelease: false
          make_latest: true
          tag_name: ${{ needs.changelog.outputs.release_tag }}

      - name: Clean illegal characters from matrix.target
        id: clean_target_name
        run: |
          ILLEGAL_CHARS_REGEX='[":<>|*?\\/\r\n]'
          CLEANED_TARGET=$(echo "${{ matrix.target }}" | sed -E "s/$ILLEGAL_CHARS_REGEX//g")
          echo "Original target: ${{ matrix.target }}"
          echo "Cleaned target: $CLEANED_TARGET"
          echo "cleaned_target=$CLEANED_TARGET" >> $GITHUB_ENV

      - name: Upload assets to github artifact
        uses: actions/upload-artifact@v7
        with:
          name: builds for ${{ env.cleaned_target }}
          path: ${{ github.workspace }}/build/compress/*
          compression-level: 0
          if-no-files-found: error
